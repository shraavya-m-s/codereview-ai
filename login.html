<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CodeReview AI</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- CodeReview AI Core Design System -->
  <link rel="stylesheet" href="static/css/main.css">
  <link rel="stylesheet" href="static/css/components.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 440px;">
    <!-- Logo & Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 shadow-sm mb-3" style="width: 52px; height: 52px;">
        <i class="bi bi-shield-check fs-2"></i>
      </div>
      <h1 class="h3 fw-bold text-dark mb-1">CodeReview<span class="text-primary">AI</span></h1>
      <p class="text-secondary small mb-0">Intern Project Review & SRS Verification System</p>
    </div>

    <!-- Login Card -->
    <div class="cr-card p-4 shadow-sm border">
      <div class="mb-4">
        <h2 class="h5 fw-bold mb-1">Sign in to your account</h2>
        <p class="text-muted small mb-0">Enter your credentials to access your dashboard</p>
      </div>

      <!-- Error Alert (hidden by default, toggled via JS) -->
      <div class="cr-alert cr-alert-danger d-none" id="loginErrorAlert" role="alert">
        <i class="bi bi-exclamation-octagon-fill fs-5 text-danger flex-shrink-0"></i>
        <div class="small" id="loginErrorMessage">Invalid username or password. Please try again.</div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" action="index.html" method="get">
        <!-- Username -->
        <div class="cr-form-group mb-3">
          <label for="usernameInput" class="cr-label">Username <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control cr-input border-start-0 ps-0" id="usernameInput" placeholder="e.g. dr_aris or rahul_intern" required autofocus>
          </div>
        </div>

        <!-- Password with Show/Hide toggle -->
        <div class="cr-form-group mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="passwordInput" class="cr-label mb-0">Password <span class="required">*</span></label>
            <span class="text-muted" style="font-size: 0.75rem;">Standard session auth</span>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control cr-input border-start-0 border-end-0 ps-0" id="passwordInput" placeholder="••••••••" required>
            <button class="btn btn-outline-secondary border border-start-0 bg-light" type="button" id="togglePasswordBtn" title="Toggle password visibility">
              <i class="bi bi-eye text-muted" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="cr-btn cr-btn-primary w-100 py-2.5 mb-3 fw-bold" id="loginSubmitBtn">
          <span>Sign In</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- Demo Role Quick-Fill Buttons -->
      <div class="pt-3 border-top mt-2">
        <div class="text-muted text-uppercase fw-bold mb-2 text-center" style="font-size: 0.68rem; letter-spacing: 0.05em;">Quick Demo Credentials</div>
        <div class="d-grid gap-1.5">
          <button class="btn btn-sm btn-outline-primary py-1 px-2 d-flex justify-content-between align-items-center" onclick="fillCredentials('dr_aris', 'password123', 'mentor')">
            <span class="fw-semibold small"><i class="bi bi-mortarboard-fill me-1"></i> Mentor: Dr. Aris</span>
            <span class="badge bg-primary-subtle text-primary" style="font-size: 0.7rem;">Click to Fill</span>
          </button>
          <button class="btn btn-sm btn-outline-success py-1 px-2 d-flex justify-content-between align-items-center" onclick="fillCredentials('rahul_intern', 'password123', 'student')">
            <span class="fw-semibold small"><i class="bi bi-person-fill me-1"></i> Student: Rahul</span>
            <span class="badge bg-success-subtle text-success" style="font-size: 0.7rem;">Click to Fill</span>
          </button>
          <button class="btn btn-sm btn-outline-secondary py-1 px-2 d-flex justify-content-between align-items-center" onclick="fillCredentials('admin', 'admin123', 'admin')">
            <span class="fw-semibold small"><i class="bi bi-shield-lock-fill me-1"></i> Administrator</span>
            <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.7rem;">Click to Fill</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Security & Rule-based Note -->
    <div class="text-center mt-4 text-muted small">
      <i class="bi bi-lock-fill text-secondary"></i> Django Session-Based Authentication &bull; CSRF Protected
    </div>
  </div>

  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('passwordToggleIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.className = isPassword ? 'bi bi-eye-slash text-primary' : 'bi bi-eye text-muted';
    });

    // Quick demo fill helper
    function fillCredentials(user, pass, role) {
      document.getElementById('usernameInput').value = user;
      document.getElementById('passwordInput').value = pass;
      localStorage.setItem('cr_dev_role', role);
    }

    // Submit handler with realistic feedback
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const errorAlert = document.getElementById('loginErrorAlert');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();

      if (!user || !pass) {
        errorAlert.classList.remove('d-none');
        return;
      }

      // Button loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Authenticating...';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    });
  </script>
</body>
</html>
